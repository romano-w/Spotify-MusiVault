[tool.poetry]
name = "spotify-musivault"
version = "0.1.0"
description = ""
authors = ["Will Romano <will.j.romano@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
flask = "^3.0.1"
spotipy = "^2.23.0"
python-dotenv = "^1.0.1"
authlib = "^1.3.0"
sqlalchemy = "^2.0.41"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^24.8.0"
ruff = "^0.6.1"
pytest-cov = "^5.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Tooling configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-select = [
	"E", # pycodestyle errors
	"F", # pyflakes
	"I", # isort
	"UP", # pyupgrade
]
ignore = [
	"E203", # whitespace before ':' (black compatibility)
	"E501", # line length handled by black
]
exclude = [
	".venv",
	"venv",
	".git",
	"__pycache__",
	".pytest_cache",
	"build",
	"dist",
]
